<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>訂單識別助手</title>

    <!-- Google Fonts: Playfair Display (Serif) & Inter (Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-color: #FAF9F6;
            --surface-color: #FFFFFF;
            --text-primary: #1A1A1A;
            --text-secondary: #666666;
            --text-accent: #8E8E8E;
            --border-color: #E0E0E0;
            --primary-btn: #1A1A1A;
            --primary-btn-text: #FFFFFF;
            --error-color: #A94442;

            --font-serif: "Playfair Display", serif;
            /* 標題保留些許西式優雅 */
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            /* 內文優先使用系統繁體中文字體 */

            --spacing-unit: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Ambient Noise Texture for "Paper" feel */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: -1;
        }

        /* --- Navbar --- */
        .navbar {
            background: transparent;
            padding: 32px 24px 16px;
            text-align: center;
        }

        .navbar h1 {
            font-family: var(--font-serif);
            font-size: 26px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.05em;
            position: relative;
            display: inline-block;
        }

        .navbar h1::after {
            content: '';
            display: block;
            width: 40px;
            height: 2px;
            background: var(--text-primary);
            margin: 8px auto 0;
        }

        /* --- Container --- */
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 0 24px 48px;
        }

        /* --- Cards (Redefined as Sections) --- */
        .card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            margin-bottom: 32px;
            border-radius: 2px;
            box-shadow: none;
            overflow: hidden;
            transition: border-color 0.3s ease;
        }

        /* --- Upload Area --- */
        .upload-area {
            padding: 60px 32px;
            text-align: center;
            cursor: pointer;
            background: var(--surface-color);
            transition: background-color 0.3s ease;
        }

        .upload-area:active {
            background-color: #F5F5F5;
        }

        .upload-icon {
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        .upload-icon svg {
            width: 48px;
            height: 48px;
            stroke: var(--text-primary);
            stroke-width: 1.5;
            fill: none;
        }

        .upload-title {
            font-family: var(--font-sans);
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }

        .upload-hint {
            font-family: var(--font-sans);
            font-size: 13px;
            color: var(--text-accent);
            letter-spacing: 0.05em;
        }

        #fileInput {
            display: none;
        }

        /* --- Preview --- */
        .preview-section {
            display: none;
            border: none;
            background: transparent;
        }

        .preview-image {
            display: block;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            margin-bottom: 24px;
            filter: grayscale(10%);
            background-color: #EEE;
        }

        .button-group {
            display: flex;
            gap: 16px;
            flex-direction: column;
        }

        /* --- Mode Toggle --- */
        .mode-toggle {
            display: flex;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            color: var(--text-secondary);
            border: none;
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: var(--text-primary);
            color: #FFFFFF;
        }

        .mode-btn:not(:last-child) {
            border-right: 1px solid var(--border-color);
        }

        /* --- Threshold Control --- */
        .threshold-control {
            margin-bottom: 24px;
            padding: 16px;
            border: 1px dashed var(--border-color);
            background: #FAFAFA;
            display: none;
        }

        .threshold-control.show {
            display: block;
        }

        .threshold-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
        }

        .threshold-slider {
            width: 100%;
            height: 2px;
            background: var(--border-color);
            outline: none;
            -webkit-appearance: none;
        }

        .threshold-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--text-primary);
            cursor: pointer;
            border-radius: 0;
            /* Square thumb */
        }

        .processing-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }

        .processing-text {
            font-family: var(--font-sans);
            font-size: 14px;
            color: var(--text-primary);
            letter-spacing: 0.1em;
            font-weight: 500;
        }

        /* --- Buttons --- */
        .btn {
            width: 100%;
            padding: 16px 24px;
            font-family: var(--font-sans);
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.1em;
            border: 1px solid var(--primary-btn);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            border-radius: 0;
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-primary {
            background: var(--primary-btn);
            color: var(--primary-btn-text);
        }

        .btn-secondary {
            background: transparent;
            color: var(--primary-btn);
            border: 1px solid var(--border-color);
        }

        .btn:disabled {
            background: #CCC;
            border-color: #CCC;
            cursor: not-allowed;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 13px;
            letter-spacing: 0.05em;
            border-radius: 0;
            width: auto;
            min-width: 80px;
        }

        /* --- Results Section --- */
        .results-section {
            display: none;
            border-top: 2px solid var(--text-primary);
            padding-top: 16px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 0 24px 0;
            background: transparent;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .results-title {
            font-family: var(--font-serif);
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            /* font-style: italic; Removed for Chinese title */
        }

        /* --- List Items --- */
        .list-item {
            display: flex;
            align-items: baseline;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-label {
            width: 80px;
            font-family: var(--font-sans);
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
            flex-shrink: 0;
            font-weight: 500;
        }

        .list-value {
            flex: 1;
            font-size: 16px;
            color: var(--text-primary);
        }

        /* --- Item Block --- */
        .item-block {
            background: var(--surface-color);
            padding: 24px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 8px;
        }

        .item-block-label {
            font-family: var(--font-sans);
            font-size: 16px;
            font-weight: 600;
        }

        /* --- Inputs --- */
        .editable-input {
            width: 100%;
            font-family: var(--font-sans);
            font-size: 16px;
            color: var(--text-primary);
            border: none;
            border-bottom: 1px solid var(--border-color);
            background: transparent;
            padding: 4px 0;
            border-radius: 0;
            outline: none;
            transition: border-color 0.2s;
        }

        .editable-input:focus {
            border-bottom: 1px solid var(--text-primary);
        }

        .editable-input.highlight {
            font-weight: 600;
            color: var(--text-primary);
        }

        input[type=number] {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* --- Actions --- */
        .confirm-btn {
            width: 100%;
            margin-top: 32px;
            padding: 20px;
            background: var(--primary-btn);
            color: #fff;
            border: none;
            font-family: var(--font-sans);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.2em;
            /* text-transform: uppercase; */
            cursor: pointer;
            border-radius: 0;
        }

        .delete-btn {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            font-size: 12px;
            /* text-transform: uppercase; */
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            border-color: var(--error-color);
            color: var(--error-color);
        }

        /* --- Error --- */
        .error-card {
            display: none;
            margin-bottom: 32px;
            padding: 16px;
            border: 1px solid var(--error-color);
            background: transparent;
            color: var(--error-color);
            font-size: 14px;
            text-align: center;
        }

        /* --- Footer --- */
        .footer {
            margin-top: 64px;
            text-align: center;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            padding-top: 32px;
        }

        .footer-card {
            background: transparent;
            padding: 0;
            margin-bottom: 24px;
            text-align: left;
        }

        .footer-title {
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 0.05em;
        }

        .footer-text {
            font-family: var(--font-sans);
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 2;
        }

        .copyright {
            font-family: var(--font-sans);
            font-size: 11px;
            color: var(--text-accent);
            letter-spacing: 0.15em;
            margin-top: 32px;
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
            border-bottom: 1px solid var(--text-secondary);
            padding-bottom: 2px;
        }

        /* --- Spinner --- */
        .spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <h1>訂單識別</h1>
    </nav>

    <div class="container">
        <!-- Upload Section -->
        <div class="card upload-section" id="uploadSection">
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="square" stroke-linejoin="miter">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                </div>
                <div class="upload-title">上傳訂單照片</div>
                <div class="upload-hint">拍照或點擊選擇圖片</div>
            </div>
            <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
        </div>

        <!-- Preview Card -->
        <div class="preview-section" id="previewSection">
            <!-- Mode Toggle (Restored & Styled) -->
            <div class="mode-toggle">
                <button class="mode-btn active" id="modeOriginal" onclick="setMode('original')">
                    📷 原始照片
                </button>
                <button class="mode-btn" id="modeDocument" onclick="setMode('document')">
                    📠 文件模式
                </button>
            </div>

            <div id="modeIndicator" class="mode-indicator" style="display:none;"></div>

            <!-- Threshold Control -->
            <div class="threshold-control" id="thresholdControl">
                <div class="threshold-label">
                    <span>黑白閾值</span>
                    <span id="thresholdValue">130</span>
                </div>
                <input type="range" class="threshold-slider" id="thresholdSlider" min="50" max="200" value="130"
                    oninput="adjustThreshold(this.value)">
            </div>

            <div style="position: relative;">
                <img id="previewImage" class="preview-image" src="" alt="預覽">
                <div class="processing-overlay" id="processingOverlay" style="display:none;">
                    <span class="spinner" style="font-size: 32px; color: #1A1A1A;">◌</span>
                    <span class="processing-text">處理中...</span>
                </div>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" id="analyzeBtn" onclick="analyzeImage()">開始識別分析</button>
                <button class="btn btn-secondary" onclick="resetImage()">重新上傳</button>
            </div>
        </div>

        <!-- Error Card -->
        <div class="card error-card" id="errorCard">
            <div class="error-text" id="errorText"></div>
        </div>

        <!-- Results Card -->
        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <div class="results-title">識別結果</div>
                <div class="results-actions">
                    <button class="btn btn-small btn-primary" onclick="shareResult()">分享</button>
                </div>
            </div>
            <div id="resultsList"></div>
        </div>

        <div class="footer">
            <div class="footer-card">
                <div class="footer-title">使用說明</div>
                <div class="footer-text">
                    01. 上傳訂單照片<br>
                    02. 選擇「文件模式」增強清晰度 (可選)<br>
                    03. 點擊「開始識別分析」<br>
                    04. 檢查、修正資料並分享
                </div>
            </div>
            <div class="copyright">
                Designed by 德 <br>
                <a href="https://github.com/lalawgwg99/phonesbs" target="_blank"
                    style="margin-top: 8px; display: inline-block;">
                    📖 查看 GitHub 專案
                </a>
            </div>
        </div>
    </div>

    <script>
        // API URL (相對路徑, 使用 Pages Functions)
        const API_URL = '';

        let selectedFile = null;
        let orderData = null;
        let originalImageData = null;  // 儲存原始圖片 base64
        let processedImageData = null; // 儲存處理後圖片 base64
        let currentMode = 'original';  // 'original' 或 'document'
        let currentThreshold = 130;    // 預設閾值

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            selectedFile = file;
            const reader = new FileReader();
            reader.onload = async function (e) {
                originalImageData = e.target.result;
                processedImageData = null;
                currentMode = 'original';

                // 重設 UI 狀態
                document.getElementById('modeOriginal').classList.add('active');
                document.getElementById('modeDocument').classList.remove('active');
                document.getElementById('thresholdControl').classList.remove('show');
                document.getElementById('modeIndicator').style.display = 'none';

                document.getElementById('previewImage').src = e.target.result;
                document.getElementById('uploadSection').style.display = 'none';
                document.getElementById('previewSection').style.display = 'block';
                document.getElementById('errorCard').style.display = 'none';
                document.getElementById('resultsSection').style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        // ========== 數位傳真引擎核心 (Preserved from Upstream) ==========

        function processToDocumentMode(base64Data, threshold = 130) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxWidth = 1280;
                    const scale = img.width > maxWidth ? maxWidth / img.width : 1;
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                        const finalColor = gray < threshold ? 0 : 255;
                        data[i] = finalColor;
                        data[i + 1] = finalColor;
                        data[i + 2] = finalColor;
                    }
                    ctx.putImageData(imageData, 0, 0);
                    resolve(canvas.toDataURL('image/jpeg', 0.9));
                };
                img.src = base64Data;
            });
        }

        async function setMode(mode) {
            currentMode = mode;
            document.getElementById('modeOriginal').classList.toggle('active', mode === 'original');
            document.getElementById('modeDocument').classList.toggle('active', mode === 'document');
            document.getElementById('thresholdControl').classList.toggle('show', mode === 'document');

            // Indicator logic removed for minimalism, or keep minimal if needed. 
            // In high-end design, we trust the toggle state.
            // Reset image source logic
            if (originalImageData) {
                if (mode === 'document') {
                    await applyDocumentMode();
                } else {
                    document.getElementById('previewImage').src = originalImageData;
                    processedImageData = null;
                }
            }
        }

        async function applyDocumentMode() {
            if (!originalImageData) return;
            const overlay = document.getElementById('processingOverlay');
            overlay.style.display = 'flex';
            try {
                processedImageData = await processToDocumentMode(originalImageData, currentThreshold);
                document.getElementById('previewImage').src = processedImageData;
            } finally {
                overlay.style.display = 'none';
            }
        }

        async function adjustThreshold(value) {
            currentThreshold = parseInt(value);
            document.getElementById('thresholdValue').textContent = value;
            if (currentMode === 'document' && originalImageData) {
                await applyDocumentMode();
            }
        }

        function resetImage() {
            selectedFile = null;
            orderData = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('uploadSection').style.display = 'block';
            document.getElementById('previewSection').style.display = 'none';
            document.getElementById('errorCard').style.display = 'none';
            document.getElementById('resultsSection').style.display = 'none';
        }

        async function analyzeImage() {
            if (!selectedFile) return;

            const btn = document.getElementById('analyzeBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner">◌</span> 處理中...';
            document.getElementById('errorCard').style.display = 'none';

            try {
                const formData = new FormData();
                if (currentMode === 'document' && processedImageData) {
                    const response = await fetch(processedImageData);
                    const blob = await response.blob();
                    formData.append('image', blob, 'document.jpg');
                } else {
                    formData.append('image', selectedFile);
                }

                const response = await fetch(`${API_URL}/api/analyze-simple`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                if (!result.success) throw new Error(result.error || '識別失敗');

                orderData = result.data;
                displayResults();
            } catch (err) {
                document.getElementById('errorCard').style.display = 'block';
                document.getElementById('errorText').textContent = err.message || '識別過程發生錯誤';
            } finally {
                btn.disabled = false;
                btn.textContent = '開始識別分析';
            }
        }

        function formatItemCode(code, name) {
            if (!code) return '';
            const cleanCode = code.replace(/\D/g, '').slice(-9);
            if (cleanCode.length < 9) return cleanCode;
            const lowerName = (name || '').toLowerCase();
            let prefix = '';
            if (lowerName.includes('瓦斯') || lowerName.includes('熱水器') || lowerName.includes('爐') || lowerName.includes('gas') || lowerName.includes('heater')) {
                prefix = '41';
            } else if (lowerName.includes('手機') || lowerName.includes('手錶') || lowerName.includes('pods') || lowerName.includes('phone') || lowerName.includes('watch')) {
                prefix = '42';
            } else if (lowerName.includes('電腦') || lowerName.includes('mac') || lowerName.includes('ipad')) {
                prefix = '45';
            }
            return prefix + cleanCode;
        }

        function formatDatetime(datetime) {
            if (!datetime) return '';
            const date = new Date(datetime);
            if (!isNaN(date.getTime())) {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                return `${year}/${month}/${day} ${hours}:${minutes}`;
            }
            return datetime;
        }

        function displayResults() {
            document.getElementById('resultsSection').style.display = 'block';
            renderResultsList();
        }

        function renderResultsList() {
            let html = '';

            // Using Traditional Chinese labels per requirement, but styled elegantly

            html += `<div class="list-item">
                <span class="list-label">店點</span>
                <input type="text" class="editable-input" id="edit-store" value="${orderData.store || ''}" placeholder="店別">
            </div>`;

            html += `<div class="list-item">
                <span class="list-label">日期</span>
                <input type="text" class="editable-input" id="edit-datetime" value="${orderData.datetime || ''}" placeholder="時間">
            </div>`;

            html += `<div class="list-item">
                <span class="list-label">單號</span>
                <input type="text" class="editable-input highlight" id="edit-bookingNo" value="${orderData.bookingNo || ''}" placeholder="訂貨編號">
            </div>`;

            html += `<div class="list-item">
                <span class="list-label">電話</span>
                <input type="text" class="editable-input" id="edit-phone" value="${orderData.phone || ''}" placeholder="聯絡電話">
            </div>`;

            html += `<div class="list-item">
                <span class="list-label">地址</span>
                <input type="text" class="editable-input" id="edit-address" value="${orderData.address || ''}" placeholder="送貨地址">
            </div>`;

            // Removed Invoice field as per request

            // Items
            if (orderData.items && orderData.items.length > 0) {
                orderData.items.forEach((item, index) => {
                    const code = formatItemCode(item.itemCode, item.itemName);
                    html += `<div class="item-block" id="item-block-${index}">
                        <div class="item-header">
                            <div class="item-block-label">商品 ${index + 1}</div>
                            <button class="delete-btn" onclick="deleteItem(${index})">刪除</button>
                        </div>
                        <div class="list-item" style="border: none; padding: 4px 0;">
                            <span class="list-label">代碼</span>
                            <input type="text" class="editable-input highlight" id="edit-code-${index}" value="${code}">
                        </div>
                        <div class="list-item" style="border: none; padding: 4px 0;">
                            <span class="list-label">品名</span>
                            <input type="text" class="editable-input" id="edit-name-${index}" value="${item.itemName || ''}">
                        </div>
                        <div class="list-item" style="border: none; padding: 4px 0;">
                            <span class="list-label">數量</span>
                            <input type="number" class="editable-input" id="edit-qty-${index}" value="${item.quantity || 1}" min="1" style="width: 60px;">
                        </div>
                    </div>`;
                });
            }

            // Remarks
            html += `<div class="list-item">
                <span class="list-label">備註</span>
                <input type="text" class="editable-input" id="edit-remarks" value="${orderData.remarks || ''}" placeholder="備註事項">
            </div>`;

            // Confirm
            html += `<div style="padding: 16px 0;">
                <button class="confirm-btn" onclick="confirmEdit()">確認資料正確並分享</button>
            </div>`;

            document.getElementById('resultsList').innerHTML = html;
        }

        function deleteItem(index) {
            if (orderData.items && orderData.items.length > index) {
                orderData.items.splice(index, 1);
                renderResultsList();
            }
        }

        function confirmEdit() {
            orderData.store = document.getElementById('edit-store').value;
            orderData.datetime = document.getElementById('edit-datetime').value;
            orderData.bookingNo = document.getElementById('edit-bookingNo').value;
            orderData.phone = document.getElementById('edit-phone').value;
            orderData.address = document.getElementById('edit-address').value;
            // Removed Invoice
            orderData.remarks = document.getElementById('edit-remarks').value;

            if (orderData.items) {
                orderData.items.forEach((item, index) => {
                    const codeInput = document.getElementById(`edit-code-${index}`);
                    const nameInput = document.getElementById(`edit-name-${index}`);
                    const qtyInput = document.getElementById(`edit-qty-${index}`);
                    if (codeInput) item.itemCode = codeInput.value;
                    if (nameInput) item.itemName = nameInput.value;
                    if (qtyInput) item.quantity = parseInt(qtyInput.value) || 1;
                });
            }
            shareResult();
        }

        async function shareResult() {
            if (!orderData) return;
            const lines = [
                `店點：${orderData.store || ''}`,
                `日期：${formatDatetime(orderData.datetime)}`,
                `${orderData.bookingNo || ''}`
            ];

            // Removed Items from share text as per request/restoration

            if (orderData.phone) lines.push(`電話：${orderData.phone}`);
            if (orderData.address) lines.push(`地址：${orderData.address}`);
            // Removed Invoice
            lines.push(`備註：${orderData.remarks || ''}`);

            const text = lines.join('\n');

            try {
                const filesToShare = [];
                if (selectedFile) filesToShare.push(selectedFile);
                if (processedImageData) {
                    const response = await fetch(processedImageData);
                    const blob = await response.blob();
                    filesToShare.push(new File([blob], 'clear_document.jpg', { type: 'image/jpeg' }));
                }

                if (navigator.share && filesToShare.length > 0) {
                    await navigator.share({ title: '訂單資訊', text: text, files: filesToShare });
                } else {
                    await navigator.clipboard.writeText(text);
                    alert('已複製到剪貼簿！');
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    await navigator.clipboard.writeText(text);
                    alert('已複製到剪貼簿！');
                }
            }
        }
    </script>
</body>

</html>
